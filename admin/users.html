<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>使用者管理 | TCI 通關地圖</title>
  <link rel="stylesheet" href="../css/style.css?v=20260612-admin">
</head>
<body data-page="users" class="admin-console">
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img src="../TCI.png" alt="TCI">
      <span>通關地圖</span>
    </a>
    <nav class="nav-links">
      <a href="../index.html">查詢</a>
      <a id="adminNavLink" href="index.html">船務後台</a>
      <a id="historyNavLink" href="history.html" hidden>歷史紀錄</a>
      <a id="routesNavLink" href="routes.html" hidden>航線管理</a>
      <a id="portsNavLink" href="ports.html" hidden>港口管理</a>
      <a id="brokersNavLink" href="brokers.html" hidden>服務商管理</a>
      <a id="quotesNavLink" href="quotes.html" hidden>歷史報價</a>
      <a id="userManagementNavLink" aria-current="page" href="users.html" hidden>使用者管理</a>
    </nav>
    <div class="user-area">
      <span id="userMeta">載入中...</span>
      <button id="changePasswordButton" class="button ghost" type="button">修改密碼</button>
      <button id="signOutButton" class="button ghost" type="button">登出</button>
    </div>
  </header>

  <main class="page-shell admin-layout">
    <section class="page-heading">
      <div>
        <p class="eyebrow">Admin Console</p>
        <h1>使用者角色管理</h1>
      </div>
      <span class="brand-chip">Admin Only</span>
    </section>

    <section class="table-card">
      <div class="table-toolbar">
        <div>
          <h2>帳號與角色</h2>
          <p class="hint">Admin 可建立新帳號，也可修改或刪除既有帳號。</p>
        </div>
      </div>

      <form id="createUserForm" class="role-form create-user-form">
        <label>
          新使用者 Email
          <input id="newUserEmailInput" type="email" placeholder="name@tci-bio.com" required>
        </label>
        <label>
          暫時密碼
          <input id="newUserPasswordInput" type="password" minlength="6" required>
        </label>
        <label>
          角色
          <select id="newUserRoleSelect" required>
            <option value="user">user</option>
            <option value="shipping">shipping</option>
            <option value="admin">admin</option>
          </select>
        </label>
        <button class="button primary" type="submit">建立帳號</button>
      </form>
      <p id="createUserMessage" class="message" aria-live="polite"></p>

      <form id="roleForm" class="role-form">
        <label>
          既有使用者 Email
          <select id="roleEmailInput" required>
            <option value="">請選擇使用者</option>
          </select>
        </label>
        <label>
          角色
          <select id="roleSelect" required>
            <option value="user">user</option>
            <option value="shipping">shipping</option>
            <option value="admin">admin</option>
          </select>
        </label>
        <button id="saveRoleButton" class="button primary" type="submit">儲存角色</button>
        <button id="deleteUserButton" class="button danger" type="button">刪除帳號</button>
      </form>
      <p id="roleMessage" class="message" aria-live="polite"></p>

      <form id="resetPasswordForm" class="role-form reset-password-form">
        <label>
          重設密碼 Email
          <select id="resetPasswordEmailInput" required>
            <option value="">請選擇使用者</option>
          </select>
        </label>
        <label>
          新密碼
          <input id="managedNewPasswordInput" type="password" minlength="6" required>
        </label>
        <button id="resetPasswordButton" class="button primary" type="submit">重設密碼</button>
      </form>
      <p id="resetPasswordMessage" class="message" aria-live="polite"></p>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Email</th>
              <th>角色</th>
              <th>User ID</th>
              <th>建立日期</th>
            </tr>
          </thead>
          <tbody id="rolesTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="passwordDialog" class="modal-backdrop" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="passwordDialogTitle">
      <h2 id="passwordDialogTitle">修改密碼</h2>
      <form id="passwordForm">
        <label>
          新密碼
          <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <label>
          再輸入一次
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <div class="modal-actions">
          <button class="button primary" type="submit">儲存新密碼</button>
          <button id="cancelPasswordButton" class="button ghost" type="button">取消</button>
        </div>
      </form>
      <p id="passwordMessage" class="message" aria-live="polite"></p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/api.js?v=20260612-admin"></script>
  <script src="../js/auth.js?v=20260612-admin"></script>
  <script src="../js/search.js?v=20260612-admin"></script>
  <script src="js/users.js?v=20260612-admin"></script>
</body>
</html>
