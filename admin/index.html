<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>後台 | TCI 通關地圖</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="admin">
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img src="../TCI.png" alt="TCI">
      <span>通關地圖</span>
    </a>
    <nav class="nav-links">
      <a href="../index.html">查詢</a>
      <a id="adminNavLink" aria-current="page" href="index.html">船務後台</a>
      <a id="userManagementNavLink" href="users.html" hidden>使用者管理</a>
    </nav>
    <div class="user-area">
      <span id="userMeta">載入中...</span>
      <button id="changePasswordButton" class="button ghost" type="button">修改密碼</button>
      <button id="signOutButton" class="button ghost" type="button">登出</button>
    </div>
  </header>

  <main class="page-shell admin-layout">
    <section class="page-heading">
      <div>
        <p class="eyebrow">Shipping Team</p>
        <h1>通關紀錄後台</h1>
      </div>
      <span class="brand-chip">TCI Admin Console</span>
    </section>

    <section class="admin-entry-grid">
      <form id="recordForm" class="admin-form">
        <input id="recordId" type="hidden">
        <h2>通關紀錄</h2>
        <div class="form-grid">
          <label>
            國家
            <input id="countryInput" list="countryList" required>
            <datalist id="countryList"></datalist>
          </label>
          <label>
            口岸
            <input id="portInput" list="portList" required>
            <datalist id="portList"></datalist>
          </label>
          <label>
            劑型
            <select id="dosageFormInput" required></select>
          </label>
          <label>
            通關結果
            <select id="clearanceResultInput" required>
              <option value="">請選擇</option>
              <option value="success">成功</option>
              <option value="delayed">延遲</option>
              <option value="held">扣關</option>
              <option value="rejected">退運</option>
            </select>
          </label>
          <label>
            通關天數
            <input id="clearanceDaysInput" type="number" min="0" required>
          </label>
          <label>
            風險等級
            <select id="riskLevelInput" required>
              <option value="">請選擇</option>
              <option value="green">Green</option>
              <option value="yellow">Yellow</option>
              <option value="red">Red</option>
            </select>
          </label>
        </div>
        <label>
          所需文件
          <input id="requiredDocumentsInput" placeholder="COA, GMP Certificate" required>
        </label>
        <label>
          建議 Broker
          <input id="brokerInput">
        </label>
        <fieldset class="checkbox-row">
          <legend>異常紀錄</legend>
          <label><input id="issueSupplementInput" type="checkbox">曾補件</label>
          <label><input id="issueHeldInput" type="checkbox">曾扣關</label>
          <label><input id="issueDelayedInput" type="checkbox">曾延遲</label>
        </fieldset>
        <label>
          備註
          <textarea id="issueNoteInput"></textarea>
        </label>
        <div class="form-actions">
          <button id="submitButton" class="button primary" type="submit">新增紀錄</button>
          <button id="cancelEditButton" class="button ghost" type="button" hidden>取消編輯</button>
        </div>
        <p id="adminMessage" class="message" aria-live="polite"></p>
      </form>

      <form id="routeForm" class="admin-form">
        <input id="routeId" type="hidden">
        <h2>航線風險情報</h2>
        <p class="hint">日常只需填國家、港口、風險與天數；座標可由系統依常見港口或國家位置推定。</p>
        <div class="form-grid">
          <label>
            航線名稱
            <input id="routeNameInput" placeholder="Shanghai → Los Angeles">
          </label>
          <label>
            運輸方式
            <select id="transportModeInput" required>
              <option value="ocean">海運</option>
              <option value="air">空運</option>
              <option value="multimodal">複合運輸</option>
            </select>
          </label>
          <label>
            起運國家
            <input id="originCountryInput" list="countryList" required>
          </label>
          <label>
            起運港
            <input id="originPortInput" required>
          </label>
          <label>
            目的國家
            <input id="destinationCountryInput" list="countryList" required>
          </label>
          <label>
            目的港
            <input id="destinationPortInput" required>
          </label>
          <label>
            預估天數
            <input id="routeDaysInput" type="number" min="0" required>
          </label>
          <label>
            距離 km
            <input id="routeDistanceInput" type="number" min="0">
          </label>
          <label>
            航線風險
            <select id="routeRiskInput" required>
              <option value="green">Green</option>
              <option value="yellow">Yellow</option>
              <option value="red">Red</option>
            </select>
          </label>
          <label>
            關鍵通道
            <input id="chokepointsInput" placeholder="Malacca, Suez">
          </label>
        </div>
        <details class="advanced-fields">
          <summary>進階座標設定</summary>
          <div class="form-grid">
            <label>
              起點緯度
              <input id="originLatInput" type="number" step="0.000001">
            </label>
            <label>
              起點經度
              <input id="originLngInput" type="number" step="0.000001">
            </label>
            <label>
              終點緯度
              <input id="destinationLatInput" type="number" step="0.000001">
            </label>
            <label>
              終點經度
              <input id="destinationLngInput" type="number" step="0.000001">
            </label>
          </div>
          <label>
            路徑座標
            <textarea id="routePathInput" placeholder="31.2304,121.4737; 1.3521,103.8198; 33.7405,-118.2775"></textarea>
          </label>
        </details>
        <label>
          航線備註
          <textarea id="routeNotesInput"></textarea>
        </label>
        <div class="form-actions">
          <button id="routeSubmitButton" class="button primary" type="submit">新增航線</button>
          <button id="routeCancelEditButton" class="button ghost" type="button" hidden>取消編輯</button>
        </div>
        <p id="routeMessage" class="message" aria-live="polite"></p>
      </form>
    </section>

    <section class="table-card">
      <div class="table-toolbar">
        <h2>歷史紀錄管理</h2>
        <label>
          依國家篩選
          <select id="adminCountryFilter">
            <option value="">全部國家</option>
          </select>
        </label>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>國家</th>
              <th>口岸</th>
              <th>劑型</th>
              <th>結果</th>
              <th>天數</th>
              <th>風險</th>
              <th>文件</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="table-card">
      <div class="table-toolbar">
        <h2>航線情報管理</h2>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>航線</th>
              <th>方式</th>
              <th>起點</th>
              <th>終點</th>
              <th>天數</th>
              <th>風險</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="routesTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="passwordDialog" class="modal-backdrop" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="passwordDialogTitle">
      <h2 id="passwordDialogTitle">修改密碼</h2>
      <form id="passwordForm">
        <label>
          新密碼
          <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <label>
          再輸入一次
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <div class="modal-actions">
          <button class="button primary" type="submit">儲存新密碼</button>
          <button id="cancelPasswordButton" class="button ghost" type="button">取消</button>
        </div>
      </form>
      <p id="passwordMessage" class="message" aria-live="polite"></p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/search.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
