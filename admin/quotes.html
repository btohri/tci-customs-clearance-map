<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歷史報價 | TCI 通關地圖</title>
  <link rel="stylesheet" href="../css/style.css?v=20260612-admin2">
</head>
<body data-page="quotes" class="admin-console">
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img src="../TCI.png" alt="TCI">
      <span>通關地圖</span>
    </a>
    <nav class="nav-links">
      <a href="../index.html">查詢</a>
      <a id="adminNavLink" href="index.html">船務後台</a>
      <a id="historyNavLink" href="history.html" hidden>歷史紀錄</a>
      <a id="routesNavLink" href="routes.html" hidden>航線管理</a>
      <a id="portsNavLink" href="ports.html" hidden>港口管理</a>
      <a id="brokersNavLink" href="brokers.html" hidden>服務商管理</a>
      <a id="quotesNavLink" aria-current="page" href="quotes.html" hidden>歷史報價</a>
      <a id="userManagementNavLink" href="users.html" hidden>使用者管理</a>
    </nav>
    <div class="user-area">
      <span id="userMeta">載入中...</span>
      <button id="changePasswordButton" class="button ghost" type="button">修改密碼</button>
      <button id="signOutButton" class="button ghost" type="button">登出</button>
    </div>
  </header>

  <main class="page-shell admin-layout">
    <section class="page-heading">
      <div>
        <p class="eyebrow">Freight Quotes</p>
        <h1>歷史報價</h1>
      </div>
      <span class="brand-chip">Internal Reference</span>
    </section>

    <div class="admin-split">
    <section class="table-card">
      <div class="table-toolbar">
        <div>
          <h2>新增 / 編輯報價</h2>
          <p class="hint">只作內部歷史參考，不代表即時真實運價。</p>
        </div>
      </div>
      <form id="quoteForm" class="compact-form">
        <input id="quoteId" type="hidden">
        <div class="form-grid quote-grid">
          <label>
            關聯航線
            <select id="quoteRouteInput">
              <option value="">不指定</option>
            </select>
          </label>
          <label>
            起運國家
            <select id="quoteOriginCountrySelect">
              <option value="">請選擇國家</option>
            </select>
          </label>
          <label>
            起運港
            <select id="quoteOriginPortSelect" disabled>
              <option value="">請先選國家</option>
            </select>
          </label>
          <label id="quoteOriginPortManualLabel" hidden>
            起運港（手動輸入）
            <input id="quoteOriginPortManual" placeholder="輸入港口名稱">
          </label>
          <label>
            目的國家
            <select id="quoteDestinationCountrySelect">
              <option value="">請選擇國家</option>
            </select>
          </label>
          <label>
            目的港
            <select id="quoteDestinationPortSelect" disabled>
              <option value="">請先選國家</option>
            </select>
          </label>
          <label id="quoteDestinationPortManualLabel" hidden>
            目的港（手動輸入）
            <input id="quoteDestinationPortManual" placeholder="輸入港口名稱">
          </label>
          <label>
            運輸方式
            <select id="quoteTransportModeInput" required>
              <option value="ocean">海運</option>
              <option value="air">空運</option>
              <option value="multimodal">複合運輸</option>
            </select>
          </label>
          <label>
            櫃型/計費單位
            <input id="containerTypeInput" placeholder="40HQ / pallet / kg">
          </label>
          <label>
            計費重量 kg
            <input id="chargeableWeightInput" type="number" min="0" step="0.01">
          </label>
          <label>
            金額
            <input id="quoteAmountInput" type="number" min="0" step="0.01" required>
          </label>
          <label>
            幣別
            <input id="quoteCurrencyInput" value="USD" required>
          </label>
          <label>
            報價日期
            <input id="quoteDateInput" type="date" required>
          </label>
          <label>
            有效至
            <input id="quoteValidUntilInput" type="date">
          </label>
          <label>
            報價來源
            <input id="quoteSourceInput" list="serviceProviderList" placeholder="服務商 / 貨代 / Broker">
            <datalist id="serviceProviderList"></datalist>
          </label>
        </div>
        <label>
          備註
          <textarea id="quoteRemarksInput"></textarea>
        </label>
        <div class="form-actions">
          <button id="quoteSubmitButton" class="button primary" type="submit">新增報價</button>
          <button id="quoteCancelEditButton" class="button ghost" type="button" hidden>取消編輯</button>
        </div>
        <p id="quoteMessage" class="message" aria-live="polite"></p>
      </form>
    </section>

    <section class="table-card">
      <div class="table-toolbar">
        <div>
          <h2>報價清單</h2>
        </div>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>航線</th>
              <th>方式</th>
              <th>單位</th>
              <th>金額</th>
              <th>來源</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="quotesTableBody"></tbody>
        </table>
      </div>
    </section>
    </div>
  </main>

  <div id="passwordDialog" class="modal-backdrop" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="passwordDialogTitle">
      <h2 id="passwordDialogTitle">修改密碼</h2>
      <form id="passwordForm">
        <label>
          新密碼
          <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <label>
          再輸入一次
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <div class="modal-actions">
          <button class="button primary" type="submit">儲存新密碼</button>
          <button id="cancelPasswordButton" class="button ghost" type="button">取消</button>
        </div>
      </form>
      <p id="passwordMessage" class="message" aria-live="polite"></p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/api.js?v=20260612-admin2"></script>
  <script src="../js/auth.js?v=20260612-admin2"></script>
  <script src="../js/search.js?v=20260612-admin2"></script>
  <script src="js/quotes.js?v=20260612-admin2"></script>
</body>
</html>
