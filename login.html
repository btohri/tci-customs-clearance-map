<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 | TCI 通關地圖</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" class="login-page">
  <main class="login-shell">
    <section class="card login-card">
      <img class="login-logo" src="TCI.png" alt="TCI">
      <p class="eyebrow">TCI Customs Clearance Map</p>
      <h1>登入通關地圖</h1>
      <form id="loginForm">
        <label>
          Email
          <input id="email" type="email" autocomplete="email" placeholder="name@tci-bio.com" required>
        </label>
        <label>
          密碼
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="button primary full" type="submit">登入</button>
      </form>
      <p id="loginMessage" class="message" aria-live="polite"></p>
      <p class="hint">信箱網域限制請於 Supabase Authentication 設定為 @tci-bio.com。</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
